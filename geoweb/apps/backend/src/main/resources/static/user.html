<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 400px; margin: auto; }
        h2 { color: #333; }
        input, button { margin: 8px 0; padding: 8px; width: 100%; box-sizing: border-box; }
        .result { margin-top: 20px; color: #007b43; }
        .error { color: #d32f2f; }
    </style>
</head>
<body>
<div class="container">
    <h2>用户注册</h2>
    <input type="text" id="reg-username" placeholder="用户名">
    <input type="password" id="reg-password" placeholder="密码">
    <button onclick="register()">注册</button>
    <div id="reg-result" class="result"></div>

    <h2>用户登录</h2>
    <input type="text" id="login-username" placeholder="用户名">
    <input type="password" id="login-password" placeholder="密码">
    <button onclick="login()">登录</button>
    <div id="login-result" class="result"></div>

    <h2>查询用户信息</h2>
    <input type="text" id="query-username" placeholder="用户名">
    <button onclick="getUserInfo()">查询</button>
    <div id="user-info" class="result"></div>
</div>

<script>
function register() {
    const username = document.getElementById('reg-username').value;
    const password = document.getElementById('reg-password').value;
    fetch('/user/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('reg-result').textContent = data.message || '注册成功！';
    })
    .catch(err => {
        document.getElementById('reg-result').textContent = '注册失败';
    });
}

function login() {
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    fetch('/user/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById('login-result').textContent = data.message || '登录成功！';
    })
    .catch(err => {
        document.getElementById('login-result').textContent = '登录失败';
    });
}

function getUserInfo() {
    const username = document.getElementById('query-username').value;
    fetch(`/user/info?username=${encodeURIComponent(username)}`)
    .then(res => res.json())
    .then(data => {
        document.getElementById('user-info').textContent = JSON.stringify(data);
    })
    .catch(err => {
        document.getElementById('user-info').textContent = '查询失败';
    });
}
</script>
</body>
</html>
