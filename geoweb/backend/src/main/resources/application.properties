server.port=8081

spring.application.name=demo
spring.datasource.url=jdbc:mysql://localhost:3306/geoweb_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=996060
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.geoweb.demo.entity
