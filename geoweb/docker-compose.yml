version: "3.9"
services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: geoweb-web:latest
    restart: unless-stopped
    depends_on:
      - backend
      - python
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro

  python:
    build:
      context: .
      dockerfile: python_service/Dockerfile
    image: geoweb-python:latest
    restart: unless-stopped
    environment:
      - MPLCONFIGDIR=/tmp/mpl
    expose:
      - "8000"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: geoweb-backend:latest
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/geoweb_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=your_password
      - PYTHON_SERVICE_URL=http://python:8000
      - SERVER_PORT=8081
    depends_on:
      - python
      - mysql
    expose:
      - "8081"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=your_password
      - MYSQL_DATABASE=geoweb_demo
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

volumes:
  mysql_data:


